# Comprobación de enlaces en HTML público (modo offline en CI).
offline = true
no_progress = true
max_retries = 2
timeout = 20
exclude_path = [
  "wp-theme/",
  "assets/audio/",
]

# Recursos externos opcionales o bloqueados en CI sin red completa.
exclude = [
  '^https://fonts\\.googleapis\\.com',
  '^https://fonts\\.gstatic\\.com',
  '^https://cdn\\.jsdelivr\\.net',
  '^https://www\\.linkedin\\.com',
  '^mailto:',
  '^tel:',
]

[files]
include = [
  "index.html",
  "about.html",
  "services.html",
  "contact.html",
  "blog.html",
  "projects.html",
  "credentials.html",
  "articulos/*.html",
  "proyectos/*.html",
  "legal/*.html",
]
