# Enlaces offline: muestra mínima (mismas páginas que pytest/Lighthouse).
offline = true
no_progress = true
max_retries = 1
timeout = 15
exclude_path = [
  "wp-theme/",
  "assets/audio/",
]

exclude = [
  '^https://fonts\\.googleapis\\.com',
  '^https://fonts\\.gstatic\\.com',
  '^https://cdn\\.jsdelivr\\.net',
  '^https://www\\.linkedin\\.com',
  '^https://calendly\\.com',
  '^https://www\\.google\\.com/maps',
  '^mailto:',
  '^tel:',
]

[files]
include = [
  "index.html",
  "services.html",
  "articulos/wordpress-seguridad-estudiantes-2026.html",
  "legal/privacidad.html",
]
