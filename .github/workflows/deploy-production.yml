# Plantilla de despliegue: solo corre si Quality Gate pasó en la misma ref.
# Sustituye el paso «Publicar» por tu método real (FTP, rsync, SiteGround, etc.).

name: Deploy Production

on:
  workflow_run:
    workflows: [Quality Gate]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    name: Desplegar a producción
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Verificar que Quality Gate fue exitoso
        if: github.event_name == 'workflow_run'
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "Quality Gate no pasó; abortando despliegue."
            exit 1
          fi

      - name: Publicar (configurar según hosting)
        run: |
          echo "Añade aquí rsync, SFTP o la acción de tu proveedor."
          echo "Ejemplo: rsync -avz --delete ./ user@host:/public_html/"
          exit 0
