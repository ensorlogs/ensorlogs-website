# Puerta de calidad obligatoria antes de desplegar a producción.
# Ejecuta en PR y en push a main; el workflow de deploy depende de este job.

name: Quality Gate

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-tests:
    name: Estándares y seguridad estática
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements-dev.txt

      - name: Instalar dependencias de prueba
        run: pip install -r tests/requirements-dev.txt

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Pytest (HTML, seguridad, PHP lint)
        run: pytest tests/ -q --tb=short

      - name: Gitleaks (secretos en el repo)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  html-validate:
    name: Validación HTML (W3C ruleset)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: html-validate en páginas públicas
        run: |
          npx --yes html-validate@8.29.0 \
            --config tests/.htmlvalidate.json \
            index.html about.html services.html contact.html blog.html projects.html credentials.html \
            articulos/*.html proyectos/*.html legal/*.html

  link-check:
    name: Enlaces internos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lychee (offline)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --config tests/lychee.toml
            index.html about.html services.html contact.html blog.html
            projects.html credentials.html articulos/*.html proyectos/*.html legal/*.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lighthouse:
    name: Rendimiento y accesibilidad (Lighthouse CI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar Lighthouse CI
        run: npm install -g @lhci/cli@0.14.0

      - name: Servir sitio estático
        run: npx --yes serve@14.2.4 -l 4173 --no-request-logging &

      - name: Esperar al servidor local
        run: npx --yes wait-on@8.0.1 http://127.0.0.1:4173

      - name: Ejecutar Lighthouse CI
        run: |
          lhci autorun --config=tests/lighthouserc.json \
            --collect.url=http://127.0.0.1:4173/index.html \
            --collect.url=http://127.0.0.1:4173/about.html \
            --collect.url=http://127.0.0.1:4173/services.html \
            --collect.url=http://127.0.0.1:4173/contact.html \
            --collect.url=http://127.0.0.1:4173/blog.html \
            --collect.url=http://127.0.0.1:4173/projects.html \
            --collect.url=http://127.0.0.1:4173/articulos/wordpress-seguridad-estudiantes-2026.html \
            --collect.url=http://127.0.0.1:4173/proyectos/proyecto-solana-residences.html \
            --collect.url=http://127.0.0.1:4173/legal/privacidad.html

      - name: Subir informes Lighthouse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: tests/lighthouse-reports/
          if-no-files-found: ignore

  quality-gate:
    name: Resumen (bloquea deploy)
    runs-on: ubuntu-latest
    needs: [static-tests, html-validate, link-check, lighthouse]
    steps:
      - run: echo "Todas las comprobaciones de calidad han pasado."
