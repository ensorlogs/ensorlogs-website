# Puerta de calidad mínima: seguridad, SEO (muestra) y Lighthouse (3 URLs).

name: Quality Gate

permissions:
  contents: read

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Seguridad, SEO y Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements-dev.txt

      - name: Pytest (seguridad + muestra SEO/enlaces)
        run: |
          pip install -r tests/requirements-dev.txt
          pytest tests/ -q --tb=short

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enlaces internos (Lychee, 4 páginas)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --config tests/lychee.toml
            index.html
            services.html
            articulos/wordpress-seguridad-estudiantes-2026.html
            legal/privacidad.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lighthouse CI (3 URLs)
        run: |
          npm install -g @lhci/cli@0.14.0
          npx --yes serve@14.2.4 -l 4173 --no-request-logging &
          npx --yes wait-on@8.0.1 http://127.0.0.1:4173
          lhci autorun --config=tests/lighthouserc.json

      - name: Informes Lighthouse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: tests/lighthouse-reports/
          if-no-files-found: ignore
