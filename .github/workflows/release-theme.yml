# Publica un tag/release visible (vX.Y.Z) sin adjuntar ensorlogs.zip al release público.
# El zip se guarda como artifact de Actions; WordPress descarga vía API con ENSORLOGS_GITHUB_TOKEN.

name: Release Theme

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Tag, notas y paquete privado (artifact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Crear ensorlogs.zip (sin seed-html ni INSTALL.txt)
        run: |
          cd wp-theme
          rm -f ensorlogs.zip
          zip -r ensorlogs.zip ensorlogs \
            -x "ensorlogs/seed-html/*" \
            -x "ensorlogs/seed-html/**" \
            -x "ensorlogs/INSTALL.txt" \
            -x "*.DS_Store" \
            -x "*/.DS_Store"
          test -f ensorlogs.zip

      - name: Publicar release en GitHub (solo tag y notas, sin descarga pública)
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true

      - name: Guardar zip como artifact (solo tú / Actions; no aparece en Assets del release)
        uses: actions/upload-artifact@v4
        with:
          name: ensorlogs-${{ github.ref_name }}
          path: wp-theme/ensorlogs.zip
          retention-days: 90
