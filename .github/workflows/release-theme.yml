# Publica tag vX.Y.Z con ensorlogs.zip en el release para que WordPress detecte la actualización.

name: Release Theme

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Empaquetar tema y publicar release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Crear ensorlogs.zip (incluye seed-html/legal para EN; sin INSTALL.txt)
        run: |
          cd wp-theme
          rm -f ensorlogs.zip
          zip -r ensorlogs.zip ensorlogs \
            -x "ensorlogs/seed-html/articulos/*" \
            -x "ensorlogs/seed-html/articulos/**" \
            -x "ensorlogs/seed-html/proyectos/*" \
            -x "ensorlogs/seed-html/proyectos/**" \
            -x "ensorlogs/INSTALL.txt" \
            -x "*.DS_Store" \
            -x "*/.DS_Store"
          test -f ensorlogs.zip
          unzip -l ensorlogs.zip | grep -q 'seed-html/legal/privacidad.en.html'

      - name: Verificar que la versión del zip coincide con el tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          ZIP_VER=$(unzip -p wp-theme/ensorlogs.zip ensorlogs/style.css | sed -n 's/^Version: //p' | tr -d '[:space:]')
          CONST_VER=$(unzip -p wp-theme/ensorlogs.zip ensorlogs/functions.php | sed -n "s/.*ENSORLOGS_THEME_VERSION', '//p" | sed "s/');.*//")
          echo "Tag: ${TAG} | style.css: ${ZIP_VER} | functions.php: ${CONST_VER}"
          test "${ZIP_VER}" = "${TAG}" && test "${CONST_VER}" = "${TAG}"

      - name: Publicar release en GitHub con ensorlogs.zip
        uses: softprops/action-gh-release@v2
        with:
          files: wp-theme/ensorlogs.zip
          generate_release_notes: true
          make_latest: true
